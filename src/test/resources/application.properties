spring.application.name=nutri-test

spring.datasource.url=jdbc:h2:mem:nutri;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

app.jwt.secret=test-secret-used-only-in-automated-tests-not-for-production-0123456789
app.jwt.expiration-seconds=3600

app.google.client-id=test-google-client-id.apps.googleusercontent.com

app.security.allowed-origins=http://localhost:5173
